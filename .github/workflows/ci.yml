name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PyTorch (CPU)
        if: runner.os != 'macOS'
        run: python -m pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install --upgrade pip && pip install torch
      - name: Install dal with all extras
        run: pip install -e ".[dev,bench,onnx,train]" scipy
      - name: Lint
        run: ruff check src tests scripts
      - name: Verify model checksums
        if: runner.os != 'Windows'
        run: cd models && shasum -a 256 -c SHA256SUMS
      - name: Tests
        run: pytest -q

  runtime-only:
    name: runtime only (numpy + OpenCV, no PyTorch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the runtime and test tools only
        run: python -m pip install --upgrade pip && pip install -e . pytest ruff
      - name: The classic tracker, benchmarks and CLI import without PyTorch or ONNX Runtime
        run: python -c "import sys, dal, dal.bench, dal.cli, dal.clips, dal.longterm; assert 'torch' not in sys.modules and 'onnxruntime' not in sys.modules; print(dal.__version__)"
      - name: Tests (learned-path tests are skipped)
        run: pytest -q
      - name: Smoke test the command line on a synthetic video
        run: |
          python - <<'PY'
          import cv2, numpy as np
          rng = np.random.default_rng(0)
          bg = cv2.GaussianBlur(rng.normal(110, 25, (240, 320)).astype(np.float32), (0, 0), 1.5)
          vw = cv2.VideoWriter("synthetic.avi", cv2.VideoWriter_fourcc(*"MJPG"), 30, (320, 240))
          for t in range(40):
              f = bg.copy(); x, y = 100 + 2 * t, 120 + t // 2
              f[y - 7:y + 7, x - 5:x + 5] = 230
              vw.write(cv2.cvtColor(np.clip(f, 0, 255).astype(np.uint8), cv2.COLOR_GRAY2BGR))
          vw.release()
          PY
          dal track synthetic.avi --init 95,113,10,14 --json track.json --out tracked.mp4
          dal info
          python -c "import json; d = json.load(open('track.json')); assert len(d['frames']) == 40 and d['tracker'] == 'classic:thermal', d['tracker']; print(d['frames'][-1])"
